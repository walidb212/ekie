<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ekie — Assistant Juridique IA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --text: #1a1a2e;
      --text-muted: #6c757d;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --radius: 12px;
      --urgence-faible: #22c55e;
      --urgence-normale: #3b82f6;
      --urgence-haute: #f97316;
      --urgence-critique: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; }
    header .badge {
      font-size: 0.7rem; background: var(--primary-light); color: var(--primary);
      padding: 0.15rem 0.5rem; border-radius: 10px; font-weight: 600;
    }
    header .domaine-indicator {
      margin-left: auto; font-size: 0.8rem; color: var(--text-muted);
    }
    header .domaine-indicator span { font-weight: 600; color: var(--primary); }

    .notice-wrap {
      width: 100%;
      padding: 0.9rem 1.5rem 0;
    }
    .notice {
      max-width: 800px;
      margin: 0 auto;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.88rem;
      line-height: 1.45;
    }
    .notice strong { font-weight: 700; }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .message {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
      max-width: 85%;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .message--user { margin-left: auto; flex-direction: row-reverse; }
    .message--bot { margin-right: auto; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 700;
    }
    .avatar--bot { background: var(--primary); color: #fff; }
    .avatar--user { background: #e2e8f0; color: var(--text); }

    .bubble {
      padding: 0.75rem 1rem; border-radius: var(--radius); font-size: 0.95rem;
      line-height: 1.5;
    }
    .message--bot .bubble { background: var(--surface); border: 1px solid var(--border); }
    .message--user .bubble { background: var(--primary); color: #fff; }

    .typing { display: flex; gap: 4px; padding: 0.75rem 1rem; }
    .typing span {
      width: 8px; height: 8px; background: var(--text-muted); border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    /* Brief cards */
    .brief-container { width: 100%; max-width: 100%; margin-top: 0.5rem; }
    .brief-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1rem;
    }
    .card-header {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-muted); font-weight: 600; margin-bottom: 0.4rem;
    }
    .card-body { font-size: 0.9rem; }
    .card-body ul, .card-body ol { padding-left: 1.2rem; }
    .card-body li { margin-bottom: 0.25rem; }

    .card--urgence { grid-column: 1 / -1; display: flex; align-items: center; gap: 0.75rem; }
    .urgence-badge {
      display: inline-block; padding: 0.25rem 0.85rem; border-radius: 20px;
      color: #fff; font-weight: 700; font-size: 0.85rem; text-transform: uppercase;
    }
    .urgence-faible .urgence-badge { background: var(--urgence-faible); }
    .urgence-normale .urgence-badge { background: var(--urgence-normale); }
    .urgence-haute .urgence-badge { background: var(--urgence-haute); }
    .urgence-critique .urgence-badge { background: var(--urgence-critique); }

    .domaine-tag {
      display: inline-block; background: var(--primary-light); color: var(--primary);
      padding: 0.2rem 0.6rem; border-radius: 6px; font-weight: 600; font-size: 0.85rem;
    }
    .sous-domaine { color: var(--text-muted); margin-top: 0.15rem; font-size: 0.85rem; }

    .ref-item { border-left: 3px solid var(--primary); padding-left: 0.6rem; margin-bottom: 0.6rem; }
    .ref-source { font-weight: 600; font-size: 0.85rem; }
    .ref-extrait { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.1rem; }
    .ref-score { font-size: 0.7rem; color: var(--primary); }

    .card--recommandation { grid-column: 1 / -1; border-left: 4px solid var(--primary); }
    .card--recommandation .card-body { font-weight: 500; }

    /* Input bar */
    .input-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
    }
    .input-bar form {
      max-width: 800px; margin: 0 auto;
      display: flex; gap: 0.5rem;
    }
    .input-bar input {
      flex: 1; padding: 0.7rem 1rem; border: 1px solid var(--border);
      border-radius: 8px; font-size: 0.95rem; font-family: inherit;
    }
    .input-bar input:focus { outline: none; border-color: var(--primary); }
    .input-bar button {
      padding: 0.7rem 1.5rem; background: var(--primary); color: #fff;
      border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    .input-bar button:hover { background: var(--primary-hover); }
    .input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 768px) {
      .brief-grid { grid-template-columns: 1fr; }
      .message { max-width: 95%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Ekie</h1>
    <span class="badge">Assistant Juridique IA</span>
    <div class="domaine-indicator" id="domaineIndicator"></div>
  </header>

  <div class="notice-wrap">
    <div class="notice">
      <strong>Info :</strong> le premier message peut prendre jusqu'a 10 secondes, le temps de reveiller le serveur.
    </div>
  </div>

  <div class="chat-container" id="chat"></div>

  <div class="input-bar">
    <form id="chatForm">
      <input type="text" id="userInput" placeholder="Décrivez votre situation juridique..." autocomplete="off" required />
      <button type="submit" id="sendBtn">Envoyer</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
